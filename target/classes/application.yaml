spring:
  application:
    name: digital-money-transfer-service

  # เปิดใช้งาน Virtual Threads (Feature ของ Java 21)
  threads:
    virtual:
      enabled: true

  # ตั้งค่าฐานข้อมูล SQL Server
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=master;encrypt=false;trustServerCertificate=true
    username: sa
    password: YourPassword123!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # ตั้งค่า JPA (ปิด ddl-auto ตามที่โจทย์บังคับ)
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ตั้งค่า Liquibase สำหรับ Migration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  # ตั้งค่า Redis
  data:
    redis:
      host: localhost
      port: 6379

  # ตั้งค่า IBM MQ (JMS)
  jms:
    ibm:
      queue-manager: QM1
      channel: DEV.APP.SVRCONN
      conn-name: localhost(1414)
      user: app
      password: ""

server:
  port: 8080